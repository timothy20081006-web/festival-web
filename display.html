<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>校慶冰淇淋叫號系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #000; overflow: hidden; font-family: 'Arial Black', sans-serif; color: white; }
        .glow-ready { text-shadow: 0 0 50px rgba(52, 211, 153, 0.6); }
        .number-ready { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="h-screen flex flex-col bg-zinc-900 p-4">

    <div class="flex justify-between items-end mb-4 px-2">
        <h1 class="text-2xl font-black tracking-tighter text-white">叫號員監控面板 <span class="text-xs font-normal text-zinc-500 ml-2">Internal Use Only</span></h1>
        <div class="flex gap-4 text-xs font-bold uppercase">
            <span class="flex items-center gap-1 text-orange-400"><span class="w-2 h-2 bg-orange-400 rounded-full"></span> 待收款</span>
            <span class="flex items-center gap-1 text-blue-400"><span class="w-2 h-2 bg-blue-400 rounded-full"></span> 製作中</span>
            <span class="flex items-center gap-1 text-emerald-400"><span class="w-2 h-2 bg-emerald-400 rounded-full"></span> 請取餐</span>
        </div>
    </div>

    <div class="flex-1 flex gap-4 overflow-hidden">
        
        <div class="flex-1 bg-zinc-950 rounded-2xl border border-zinc-800 flex flex-col">
            <div class="p-4 border-b border-zinc-800 bg-orange-500/10 text-orange-500 font-bold flex justify-between">
                <span>1. 待付款</span>
                <span id="count-waiting" class="text-xs bg-orange-500 text-white px-2 rounded-full">0</span>
            </div>
            <div id="waitingArea" class="p-4 flex flex-wrap gap-2 content-start overflow-y-auto">
                </div>
        </div>

        <div class="flex-1 bg-zinc-950 rounded-2xl border border-zinc-800 flex flex-col">
            <div class="p-4 border-b border-zinc-800 bg-blue-500/10 text-blue-400 font-bold flex justify-between">
                <span>2. 製作中 (已付)</span>
                <span id="count-paid" class="text-xs bg-blue-500 text-white px-2 rounded-full">0</span>
            </div>
            <div id="paidArea" class="p-4 flex flex-wrap gap-2 content-start overflow-y-auto">
                </div>
        </div>

        <div class="flex-1 bg-zinc-950 rounded-2xl border border-zinc-800 flex flex-col">
            <div class="p-4 border-b border-zinc-800 bg-emerald-500/10 text-emerald-400 font-bold flex justify-between">
                <span>3. 請取餐 (Ready)</span>
                <span id="count-ready" class="text-xs bg-emerald-500 text-white px-2 rounded-full">0</span>
            </div>
            <div id="readyArea" class="p-4 flex flex-wrap gap-2 content-start overflow-y-auto">
                </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";

        // Firebase 設定保持不變
        const firebaseConfig = {
            apiKey: "AIzaSyBw2axh4vgkOnNEsUgYbkmmV71TJN5Yzqc",
            authDomain: "school-festival-pos-f2c1e.firebaseapp.com",
            databaseURL: "https://school-festival-pos-f2c1e-default-rtdb.firebaseio.com",
            projectId: "school-festival-pos-f2c1e",
            storageBucket: "school-festival-pos-f2c1e.firebasestorage.app",
            messagingSenderId: "135308112776",
            appId: "1:135308112776:web:6935bd537916dbbda9c03d"
        };

        const db = getDatabase(initializeApp(firebaseConfig));

        onValue(ref(db, 'orders'), (snapshot) => {
            const data = snapshot.val();
            const areas = {
                waiting: document.getElementById('waitingArea'),
                paid: document.getElementById('paidArea'),
                ready: document.getElementById('readyArea')
            };
            const counts = {
                waiting: document.getElementById('count-waiting'),
                paid: document.getElementById('count-paid'),
                ready: document.getElementById('count-ready')
            };

            // 清空舊資料
            Object.values(areas).forEach(a => a.innerHTML = '');
            const lists = { waiting: [], paid: [], ready: [] };

            // 分類訂單
            for (let id in data) {
                const order = data[id];
                if (lists[order.status]) {
                    lists[order.status].push(order.orderNum);
                }
            }

            // 渲染與更新計數
            Object.keys(lists).forEach(status => {
                lists[status].sort((a, b) => a - b);
                counts[status].innerText = lists[status].length;

                areas[status].innerHTML = lists[status].map(n => `
                    <div class="bg-zinc-800 text-white px-3 py-1.5 rounded-lg border border-zinc-700 text-xl font-mono font-bold shadow-inner">
                        ${n}
                    </div>
                `).join('');
            });
        });
    </script>
</body>
</html>
